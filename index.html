<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hash Power Mining</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=MedievalSharp&family=Cinzel:wght@400;700&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    background: #1a0f0a;
    background-image: 
      radial-gradient(circle at 20% 50%, rgba(139, 69, 19, 0.3) 0%, transparent 50%),
      radial-gradient(circle at 80% 50%, rgba(75, 0, 130, 0.2) 0%, transparent 50%);
    min-height: 100vh;
    font-family: 'Cinzel', serif;
    color: #f4e4c1;
    padding: 10px;
    overflow-x: hidden;
  }
  
  .container {
    max-width: 500px;
    margin: 0 auto;
  }
  
  /* Başlık */
  .header {
    text-align: center;
    padding: 15px 0;
    position: relative;
  }
  
  h1 {
    font-family: 'MedievalSharp', cursive;
    font-size: 24px;
    color: #ffd700;
    text-shadow: 
      0 0 10px rgba(255, 215, 0, 0.8),
      2px 2px 4px rgba(0, 0, 0, 0.8);
    letter-spacing: 2px;
  }
  
  /* İstatistikler */
  .stats-row {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
  }
  
  .stat-box {
    flex: 1;
    background: linear-gradient(135deg, #3d2817 0%, #2d1810 100%);
    border: 2px solid #8b4513;
    border-radius: 10px;
    padding: 12px 8px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
  }
  
  .stat-box .icon {
    font-size: 24px;
    margin-bottom: 5px;
  }
  
  .stat-box .label {
    font-size: 10px;
    color: #c9a961;
    margin-bottom: 3px;
  }
  
  .stat-box .value {
    font-size: 16px;
    font-weight: bold;
    color: #ffd700;
    font-family: 'MedievalSharp', cursive;
  }
  
  /* Kazım Animasyonu */
  .mining-scene {
    background: linear-gradient(135deg, #2d1810 0%, #1a0f0a 100%);
    border: 3px solid #8b4513;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 15px;
    position: relative;
    overflow: hidden;
    box-shadow: 
      0 0 20px rgba(139, 69, 19, 0.5),
      inset 0 0 30px rgba(0, 0, 0, 0.5);
    min-height: 200px;
  }
  
  .mining-scene::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: 
      radial-gradient(circle at 30% 40%, rgba(139, 69, 19, 0.3) 0%, transparent 50%),
      radial-gradient(circle at 70% 60%, rgba(75, 0, 130, 0.2) 0%, transparent 50%);
    pointer-events: none;
  }
  
  .miner {
    position: absolute;
    bottom: 20px;
    left: 20px;
    font-size: 50px;
    animation: mine 1s ease-in-out infinite;
    filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
  }
  
  @keyframes mine {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    25% { transform: rotate(-20deg) translateY(-5px); }
    50% { transform: rotate(0deg) translateY(0); }
    75% { transform: rotate(-20deg) translateY(-5px); }
  }
  
  .rock {
    position: absolute;
    bottom: 20px;
    right: 40px;
    font-size: 60px;
    animation: shake 0.5s ease-in-out infinite;
  }
  
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px) rotate(-2deg); }
    75% { transform: translateX(3px) rotate(2deg); }
  }
  
  .spark {
    position: absolute;
    bottom: 40px;
    right: 60px;
    font-size: 20px;
    animation: sparkle 0.8s ease-in-out infinite;
    opacity: 0;
  }
  
  @keyframes sparkle {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 1; transform: scale(1.2); }
  }
  
  .mining-stats {
    position: absolute;
    top: 15px;
    left: 15px;
    right: 15px;
    display: flex;
    justify-content: space-between;
    background: rgba(0, 0, 0, 0.7);
    border: 2px solid #ffd700;
    border-radius: 8px;
    padding: 10px;
  }
  
  .mining-stats .item {
    text-align: center;
  }
  
  .mining-stats .label {
    font-size: 10px;
    color: #c9a961;
  }
  
  .mining-stats .value {
    font-size: 18px;
    font-weight: bold;
    color: #ffd700;
    font-family: 'MedievalSharp', cursive;
  }
  
  .gem-float {
    position: absolute;
    font-size: 24px;
    animation: floatUp 2s ease-out infinite;
    opacity: 0;
  }
  
  @keyframes floatUp {
    0% { opacity: 0; transform: translateY(0) scale(0.5); }
    50% { opacity: 1; transform: translateY(-30px) scale(1); }
    100% { opacity: 0; transform: translateY(-60px) scale(0.5); }
  }
  
  /* Menü Butonları */
  .menu-row {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
  }
  
  .menu-btn {
    flex: 1;
    background: linear-gradient(135deg, #5c3a21 0%, #3d2817 100%);
    border: 2px solid #8b4513;
    border-radius: 10px;
    padding: 12px 8px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
  }
  
  .menu-btn:hover {
    transform: translateY(-3px);
    border-color: #ffd700;
    box-shadow: 0 6px 15px rgba(255, 215, 0, 0.4);
  }
  
  .menu-btn:active {
    transform: translateY(-1px);
  }
  
  .menu-btn .icon {
    font-size: 28px;
    display: block;
    margin-bottom: 5px;
  }
  
  .menu-btn .label {
    font-size: 11px;
    color: #f4e4c1;
    font-family: 'MedievalSharp', cursive;
  }
  
  .menu-btn.withdraw {
    background: linear-gradient(135deg, #8b6914 0%, #5c4a0e 100%);
  }
  
  .menu-btn.admin {
    background: linear-gradient(135deg, #4a0e4e 0%, #2d0830 100%);
  }
  
  /* Form */
  .form-group {
    margin-bottom: 15px;
  }
  
  label {
    display: block;
    color: #ffd700;
    font-family: 'MedievalSharp', cursive;
    font-size: 16px;
    margin-bottom: 8px;
  }
  
  input, select {
    width: 100%;
    padding: 12px;
    background: #1a0f0a;
    border: 2px solid #8b4513;
    border-radius: 8px;
    color: #f4e4c1;
    font-size: 14px;
    font-family: 'Cinzel', serif;
  }
  
  input:focus, select:focus {
    outline: none;
    border-color: #ffd700;
    box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
  }
  
  /* Butonlar */
  .btn {
    background: linear-gradient(135deg, #ffd700 0%, #daa520 100%);
    border: 2px solid #b8860b;
    border-radius: 10px;
    padding: 12px 20px;
    color: #1a0f0a;
    font-size: 14px;
    font-weight: bold;
    font-family: 'MedievalSharp', cursive;
    cursor: pointer;
    transition: all 0.3s ease;
    margin: 5px;
  }
  
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(255, 215, 0, 0.5);
  }
  
  .btn:active {
    transform: translateY(-1px);
  }
  
  .btn.secondary {
    background: linear-gradient(135deg, #696969 0%, #404040 100%);
    border-color: #505050;
    color: #f4e4c1;
  }
  
  .btn.approve {
    background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
    border-color: #16a34a;
  }
  
  .btn.reject {
    background: linear-gradient(135deg, #f87171 0%, #dc2626 100%);
    border-color: #b91c1c;
  }
  
  /* Bakiye */
  .balance-box {
    background: linear-gradient(135deg, #ffd700 0%, #daa520 100%);
    border: 3px solid #b8860b;
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    margin-bottom: 15px;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
  }
  
  .balance-box .label {
    font-size: 14px;
    color: #1a0f0a;
    font-family: 'MedievalSharp', cursive;
  }
  
  .balance-box .amount {
    font-size: 32px;
    font-weight: bold;
    color: #1a0f0a;
    font-family: 'MedievalSharp', cursive;
  }
  
  /* Kripto Bilgi */
  .crypto-box {
    background: linear-gradient(135deg, #1a0f0a 0%, #2d1810 100%);
    border: 2px solid #8b4513;
    border-radius: 10px;
    padding: 15px;
    text-align: center;
    margin: 15px 0;
  }
  
  .crypto-box strong {
    color: #ffd700;
    font-size: 16px;
  }
  
  .crypto-box .value {
    color: #4ade80;
    font-size: 20px;
    font-weight: bold;
    font-family: 'MedievalSharp', cursive;
  }
  
  /* Admin */
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
  }
  
  .tab {
    flex: 1;
    padding: 10px;
    background: linear-gradient(135deg, #3d2817 0%, #2d1810 100%);
    border: 2px solid #8b4513;
    border-radius: 8px;
    color: #f4e4c1;
    font-size: 12px;
    font-family: 'MedievalSharp', cursive;
    cursor: pointer;
  }
  
  .tab.active {
    background: linear-gradient(135deg, #ffd700 0%, #daa520 100%);
    color: #1a0f0a;
    border-color: #b8860b;
  }
  
  /* Liste */
  .item-card {
    background: linear-gradient(135deg, #3d2817 0%, #2d1810 100%);
    border: 2px solid #8b4513;
    border-left: 4px solid #ffd700;
    border-radius: 10px;
    padding: 15px;
    margin: 10px 0;
  }
  
  .item-card strong {
    font-size: 18px;
    color: #ffd700;
    font-family: 'MedievalSharp', cursive;
  }
  
  .item-card small {
    display: block;
    color: #c9a961;
    margin: 5px 0;
    font-size: 12px;
  }
  
  /* Gizli */
  .hidden { display: none; }
  
  /* Sayfa Başlığı */
  .page-title {
    font-family: 'MedievalSharp', cursive;
    font-size: 20px;
    color: #ffd700;
    text-align: center;
    margin-bottom: 15px;
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
  }
</style>
</head>
<body>
  <div class="container">
    <!-- Ana Sayfa -->
    <div id="page-home">
      <div class="header">
        <h1>⚡ HASH MINING ⚡</h1>
      </div>
      
      <div class="stats-row">
        <div class="stat-box">
          <div class="icon">💰</div>
          <div class="label">Bakiye</div>
          <div class="value">$<span id="balance">0.00</span></div>
        </div>
        <div class="stat-box">
          <div class="icon"></div>
          <div class="label">Ürün</div>
          <div class="value"><span id="productCount">0</span></div>
        </div>
        <div class="stat-box">
          <div class="icon">💵</div>
          <div class="label">Yatırım</div>
          <div class="value">$<span id="totalInvested">0</span></div>
        </div>
      </div>
      
      <!-- Kazım Animasyonu -->
      <div class="mining-scene" id="miningScene">
        <div class="mining-stats">
          <div class="item">
            <div class="label">Saniyelik</div>
            <div class="value">$<span id="perSecond">0.00</span></div>
          </div>
          <div class="item">
            <div class="label">Dakikalık</div>
            <div class="value">$<span id="perMinute">0.00</span></div>
          </div>
          <div class="item">
            <div class="label">Saatlik</div>
            <div class="value">$<span id="perHour">0.00</span></div>
          </div>
        </div>
        <div class="miner">⛏️</div>
        <div class="rock"></div>
        <div class="spark">✨</div>
      </div>
      
      <div class="menu-row">
        <div class="menu-btn" onclick="showPage('buy')">
          <span class="icon">💎</span>
          <span class="label">SATIN AL</span>
        </div>
        <div class="menu-btn withdraw" onclick="showPage('withdraw')">
          <span class="icon">💸</span>
          <span class="label">ÇEKİM</span>
        </div>
        <div class="menu-btn admin" onclick="showPage('admin')">
          <span class="icon">🔐</span>
          <span class="label">ADMIN</span>
        </div>
      </div>
    </div>

    <!-- Satın Al -->
    <div id="page-buy" class="hidden">
      <div class="page-title">💎 Mining Gücü Satın Al</div>
      <div class="form-group">
        <label>Miktar ($)</label>
        <input type="number" id="buyAmount" placeholder="10" min="1" value="10">
      </div>
      <button class="btn" onclick="buyProduct()">️ Satın Al</button>
      <button class="btn secondary" onclick="showPage('home')">← Geri</button>
    </div>

    <!-- Çekim -->
    <div id="page-withdraw" class="hidden">
      <div class="page-title">💸 Çekim Talebi</div>
      
      <div class="balance-box">
        <div class="label">Mevcut Bakiye</div>
        <div class="amount">$<span id="withdrawBalance">0.00</span></div>
        <div style="font-size: 12px; margin-top: 8px; color: #1a0f0a;">Min: $0.01</div>
      </div>
      
      <div class="form-group">
        <label>Çekilecek Miktar (USD)</label>
        <input type="number" id="withdrawAmount" placeholder="0.00" min="0.01" step="0.01" oninput="updateCryptoAmount()">
      </div>
      
      <div class="form-group">
        <label>🪙 Kripto Seçimi</label>
        <select id="withdrawCrypto" onchange="updateCryptoAmount()">
          <option value="trx">TRX (TRON) - ~$0.12</option>
          <option value="bnb">BNB - ~$600</option>
          <option value="xrp">XRP (Ripple) - ~$0.50</option>
        </select>
      </div>
      
      <div class="crypto-box">
        <strong>Karşılık:</strong><br>
        <span class="value"><span id="cryptoEquivalent">0.00</span> <span id="cryptoSymbol">TRX</span></span>
      </div>
      
      <div class="form-group">
        <label>📍 Cüzdan Adresi</label>
        <input type="text" id="walletAddress" placeholder="Cüzdan adresi...">
      </div>
      
      <button class="btn" onclick="requestWithdrawal()">💸 Çekim Oluştur</button>
      <button class="btn secondary" onclick="showPage('home')">← Geri</button>
    </div>

    <!-- Admin -->
    <div id="page-admin" class="hidden">
      <div class="page-title">🔐 Admin Panel</div>
      <div class="tabs">
        <button class="tab active" onclick="switchAdminTab('payments', this)">💳 Ödemeler</button>
        <button class="tab" onclick="switchAdminTab('withdrawals', this)">💸 Çekimler</button>
      </div>
      <div id="adminContent">Yükleniyor...</div>
      <button class="btn secondary" onclick="showPage('home')">← Geri</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBIKI-XSa6OpMQxURyTbNOTRecUTFfuQVQ",
      authDomain: "hash-power-mining.firebaseapp.com",
      projectId: "hash-power-mining",
      storageBucket: "hash-power-mining.firebasestorage.app",
      messagingSenderId: "266480566753",
      appId: "1:266480566753:web:835b6e5119e4d3e4eb92a0"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    const ADMIN_ID = "8974010159";
    
    let currentUser = null;
    let userId = null;
    let products = [];
    let lifetimeEarnings = 0;
    let totalWithdrawn = 0;
    let balance = 0;
    let currentAdminTab = 'payments';
    let unsubscribe = null;
    
    const DAILY_RATE = 1 / 90;
    const PER_SECOND = DAILY_RATE / 86400;
    
    const CRYPTO_PRICES = { trx: 0.12, bnb: 600, xrp: 0.50 };
    const CRYPTO_SYMBOLS = { trx: 'TRX', bnb: 'BNB', xrp: 'XRP' };
    
    const tg = window.Telegram.WebApp;
    tg.ready();
    
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      currentUser = tg.initDataUnsafe.user;
    }
    
    auth.signInAnonymously().then(() => {
      userId = auth.currentUser.uid;
      listenToData();
      setInterval(updateEarnings, 1000);
      setInterval(createGem, 3000);
    }).catch(err => {
      console.error('Giriş hatası:', err);
    });
    
    function listenToData() {
      if (unsubscribe) unsubscribe();
      
      unsubscribe = db.collection('users').doc(userId).onSnapshot((doc) => {
        if (doc.exists) {
          const data = doc.data();
          products = data.approvedPayments || [];
          lifetimeEarnings = data.lifetimeEarnings || 0;
          totalWithdrawn = data.totalWithdrawn || 0;
          balance = lifetimeEarnings - totalWithdrawn;
          updateUI();
        }
      }, (error) => {
        console.error('Dinleme hatası:', error);
      });
    }
    
    async function buyProduct() {
      const amount = parseFloat(document.getElementById('buyAmount').value);
      if (amount < 1) { alert('Minimum $1'); return; }
      
      const payment = {
        id: 'pay_' + Date.now(),
        amount: amount,
        earned: 0,
        status: 'pending',
        userId: userId,
        userName: currentUser ? currentUser.first_name : 'User',
        timestamp: Date.now()
      };
      
      try {
        const userRef = db.collection('users').doc(userId);
        const doc = await userRef.get();
        const data = doc.data() || {};
        const currentPending = data.pendingPayments || [];
        
        await userRef.set({
          pendingPayments: [...currentPending, payment],
          totalInvested: (data.totalInvested || 0) + amount
        }, { merge: true });
        
        alert('✅ Ödeme oluşturuldu! Admin onayı bekleniyor.');
        document.getElementById('buyAmount').value = '';
      } catch (error) {
        alert('❌ Hata: ' + error.message);
      }
    }
    
    async function updateEarnings() {
      if (products.length === 0) return;
      
      products.forEach(p => {
        p.earned = (p.earned || 0) + (p.amount * PER_SECOND);
      });
      
      lifetimeEarnings = products.reduce((sum, p) => sum + p.earned, 0);
      balance = lifetimeEarnings - totalWithdrawn;
      
      try {
        await db.collection('users').doc(userId).set({
          approvedPayments: products,
          lifetimeEarnings: lifetimeEarnings
        }, { merge: true });
      } catch (error) {
        console.error('Kaydetme hatası:', error);
      }
      
      updateUI();
    }
    
    function updateUI() {
      document.getElementById('balance').textContent = balance.toFixed(2);
      document.getElementById('withdrawBalance').textContent = balance.toFixed(2);
      document.getElementById('productCount').textContent = products.length;
      document.getElementById('totalInvested').textContent = products.reduce((sum, p) => sum + p.amount, 0);
      
      const perSec = products.reduce((sum, p) => sum + (p.amount * PER_SECOND), 0);
      document.getElementById('perSecond').textContent = perSec.toFixed(4);
      document.getElementById('perMinute').textContent = (perSec * 60).toFixed(2);
      document.getElementById('perHour').textContent = (perSec * 3600).toFixed(2);
    }
    
    function updateCryptoAmount() {
      const amount = parseFloat(document.getElementById('withdrawAmount').value) || 0;
      const crypto = document.getElementById('withdrawCrypto').value;
      const price = CRYPTO_PRICES[crypto];
      const equivalent = amount / price;
      
      document.getElementById('cryptoEquivalent').textContent = equivalent.toFixed(6);
      document.getElementById('cryptoSymbol').textContent = CRYPTO_SYMBOLS[crypto];
    }
    
    async function requestWithdrawal() {
      const amount = parseFloat(document.getElementById('withdrawAmount').value);
      const crypto = document.getElementById('withdrawCrypto').value;
      const walletAddress = document.getElementById('walletAddress').value.trim();
      
      if (amount < 0.01) { alert('❌ Min: $0.01'); return; }
      if (amount > balance) { alert('❌ Yetersiz bakiye!'); return; }
      if (!walletAddress) { alert('❌ Cüzdan gerekli!'); return; }
      
      const withdrawal = {
        id: 'wd_' + Date.now(),
        amount: amount,
        crypto: crypto,
        cryptoAmount: (amount / CRYPTO_PRICES[crypto]).toFixed(6),
        cryptoSymbol: CRYPTO_SYMBOLS[crypto],
        walletAddress: walletAddress,
        status: 'pending',
        userId: userId,
        userName: currentUser ? currentUser.first_name : 'User',
        timestamp: Date.now()
      };
      
      try {
        const userRef = db.collection('users').doc(userId);
        const doc = await userRef.get();
        const data = doc.data() || {};
        const currentWithdrawals = data.withdrawalRequests || [];
        
        await userRef.set({
          withdrawalRequests: [...currentWithdrawals, withdrawal]
        }, { merge: true });
        
        alert('✅ Çekim talebi oluşturuldu!');
        document.getElementById('withdrawAmount').value = '';
        document.getElementById('walletAddress').value = '';
        updateCryptoAmount();
      } catch (error) {
        alert('❌ Hata: ' + error.message);
      }
    }
    
    async function loadAdminPayments() {
      try {
        const snapshot = await db.collection('users').get();
        const pending = [];
        
        snapshot.forEach(doc => {
          const data = doc.data();
          if (data.pendingPayments && data.pendingPayments.length > 0) {
            data.pendingPayments.forEach(p => {
              pending.push({ ...p, userDocId: doc.id });
            });
          }
        });
        
        if (pending.length === 0) return '<p style="text-align: center; color: #4ade80;">✅ Bekleyen ödeme yok</p>';
        
        let html = '';
        pending.forEach(p => {
          html += `
            <div class="item-card">
              <strong>$${p.amount}</strong> - ${p.userName}<br>
              <small>ID: ${p.id}</small>
              <button class="btn approve" onclick="approvePayment('${p.userDocId}', '${p.id}')">✓ Onayla</button>
              <button class="btn reject" onclick="rejectPayment('${p.userDocId}', '${p.id}')">✕ Reddet</button>
            </div>
          `;
        });
        return html;
      } catch (error) {
        return '<p style="color: #f87171;"> Hata: ' + error.message + '</p>';
      }
    }
    
    async function loadAdminWithdrawals() {
      try {
        const snapshot = await db.collection('users').get();
        const pending = [];
        
        snapshot.forEach(doc => {
          const data = doc.data();
          if (data.withdrawalRequests && data.withdrawalRequests.length > 0) {
            data.withdrawalRequests.forEach(w => {
              if (w.status === 'pending') {
                pending.push({ ...w, userDocId: doc.id });
              }
            });
          }
        });
        
        if (pending.length === 0) return '<p style="text-align: center; color: #4ade80;">✅ Bekleyen çekim yok</p>';
        
        let html = '';
        pending.forEach(w => {
          html += `
            <div class="item-card">
              <strong>$${w.amount}</strong> = ${w.cryptoAmount} ${w.cryptoSymbol}<br>
              <small>Kullanıcı: ${w.userName}</small>
              <small>Cüzdan: ${w.walletAddress}</small>
              <small>ID: ${w.id}</small>
              <button class="btn approve" onclick="approveWithdrawal('${w.userDocId}', '${w.id}')">✓ Onayla</button>
              <button class="btn reject" onclick="rejectWithdrawal('${w.userDocId}', '${w.id}')">✕ Reddet</button>
            </div>
          `;
        });
        return html;
      } catch (error) {
        return '<p style="color: #f87171;">❌ Hata: ' + error.message + '</p>';
      }
    }
    
    async function loadAdmin() {
      if (currentUser?.id?.toString() !== ADMIN_ID) {
        alert('Yetkiniz yok!');
        showPage('home');
        return;
      }
      
      const container = document.getElementById('adminContent');
      container.innerHTML = '<p style="text-align: center; color: #c9a961;">Yükleniyor...</p>';
      
      if (currentAdminTab === 'payments') {
        container.innerHTML = await loadAdminPayments();
      } else {
        container.innerHTML = await loadAdminWithdrawals();
      }
    }
    
    function switchAdminTab(tab, btn) {
      currentAdminTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      loadAdmin();
    }
    
    async function approvePayment(targetUserDocId, paymentId) {
      try {
        const userRef = db.collection('users').doc(targetUserDocId);
        const doc = await userRef.get();
        
        if (!doc.exists) { alert('Kullanıcı bulunamadı!'); return; }
        
        const data = doc.data();
        const pendingPayments = data.pendingPayments || [];
        const approvedPayments = data.approvedPayments || [];
        
        const paymentIndex = pendingPayments.findIndex(p => p.id === paymentId);
        if (paymentIndex === -1) { alert('Ödeme bulunamadı!'); return; }
        
        const payment = pendingPayments[paymentIndex];
        const newPending = pendingPayments.filter(p => p.id !== paymentId);
        
        payment.status = 'approved';
        payment.approvedAt = Date.now();
        
        await userRef.set({
          pendingPayments: newPending,
          approvedPayments: [...approvedPayments, payment],
          totalInvested: (data.totalInvested || 0) + payment.amount
        }, { merge: true });
        
        alert('✅ Ödeme onaylandı!');
        await loadAdmin();
      } catch (error) {
        alert('❌ Hata: ' + error.message);
      }
    }
    
    async function rejectPayment(targetUserDocId, paymentId) {
      try {
        const userRef = db.collection('users').doc(targetUserDocId);
        const doc = await userRef.get();
        
        if (!doc.exists) { alert('Kullanıcı bulunamadı!'); return; }
        
        const data = doc.data();
        const pendingPayments = data.pendingPayments || [];
        const newPending = pendingPayments.filter(p => p.id !== paymentId);
        
        await userRef.set({
          pendingPayments: newPending
        }, { merge: true });
        
        alert(' Ödeme reddedildi!');
        await loadAdmin();
      } catch (error) {
        alert('❌ Hata: ' + error.message);
      }
    }
    
    async function approveWithdrawal(targetUserDocId, withdrawalId) {
      try {
        const userRef = db.collection('users').doc(targetUserDocId);
        const doc = await userRef.get();
        
        if (!doc.exists) { alert('Kullanıcı bulunamadı!'); return; }
        
        const data = doc.data();
        const withdrawalRequests = data.withdrawalRequests || [];
        
        const withdrawalIndex = withdrawalRequests.findIndex(w => w.id === withdrawalId);
        if (withdrawalIndex === -1) { alert('Çekim bulunamadı!'); return; }
        
        const withdrawal = withdrawalRequests[withdrawalIndex];
        const newWithdrawals = withdrawalRequests.filter(w => w.id !== withdrawalId);
        
        withdrawal.status = 'approved';
        withdrawal.approvedAt = Date.now();
        newWithdrawals.push(withdrawal);
        
        const currentTotalWithdrawn = data.totalWithdrawn || 0;
        
        await userRef.set({
          withdrawalRequests: newWithdrawals,
          totalWithdrawn: currentTotalWithdrawn + withdrawal.amount
        }, { merge: true });
        
        alert('✅ Çekim onaylandı!');
        await loadAdmin();
      } catch (error) {
        alert('❌ Hata: ' + error.message);
      }
    }
    
    async function rejectWithdrawal(targetUserDocId, withdrawalId) {
      try {
        const userRef = db.collection('users').doc(targetUserDocId);
        const doc = await userRef.get();
        
        if (!doc.exists) { alert('Kullanıcı bulunamadı!'); return; }
        
        const data = doc.data();
        const withdrawalRequests = data.withdrawalRequests || [];
        const newWithdrawals = withdrawalRequests.filter(w => w.id !== withdrawalId);
        
        await userRef.set({
          withdrawalRequests: newWithdrawals
        }, { merge: true });
        
        alert('❌ Çekim reddedildi!');
        await loadAdmin();
      } catch (error) {
        alert('❌ Hata: ' + error.message);
      }
    }
    
    function showPage(page) {
      document.querySelectorAll('.container > div').forEach(c => c.classList.add('hidden'));
      document.getElementById('page-' + page).classList.remove('hidden');
      
      if (page === 'withdraw') {
        updateCryptoAmount();
      } else if (page === 'admin') {
        loadAdmin();
      }
      
      window.scrollTo(0, 0);
    }
    
    // Elmas oluşturma animasyonu
    function createGem() {
      if (products.length === 0) return;
      
      const scene = document.getElementById('miningScene');
      const gem = document.createElement('div');
      gem.className = 'gem-float';
      gem.textContent = ['💎', '💰', '✨', '⭐'][Math.floor(Math.random() * 4)];
      gem.style.left = (60 + Math.random() * 20) + '%';
      gem.style.bottom = '40px';
      scene.appendChild(gem);
      
      setTimeout(() => gem.remove(), 2000);
    }
  </script>
</body>
</html>
