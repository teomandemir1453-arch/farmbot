<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hash Power Mining</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  body { background: #f0f2f5; padding: 20px; }
  .container { max-width: 800px; margin: 0 auto; }
  .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .stat { display: inline-block; padding: 15px 25px; background: #4a9eff; color: white; border-radius: 8px; margin: 5px; font-size: 18px; }
  .product { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 15px; border-radius: 10px; margin: 10px 0; }
  .btn { background: #4a9eff; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; margin: 5px; }
  .btn:active { transform: scale(0.98); }
  .btn-approve { background: #4ade80; }
  .btn-reject { background: #f87171; }
  .btn-withdraw { background: #f59e0b; }
  input, select { padding: 12px; border: 2px solid #ddd; border-radius: 8px; width: 100%; margin: 10px 0; font-size: 16px; }
  h1, h2 { margin-bottom: 15px; color: #1a2a3a; }
  .hidden { display: none; }
  .pending-item { background: #fff3cd; padding: 15px; border-radius: 10px; margin: 10px 0; border-left: 4px solid #ffc107; }
  .withdrawal-item { background: #e0f2fe; padding: 15px; border-radius: 10px; margin: 10px 0; border-left: 4px solid #0ea5e9; }
  .crypto-info { background: #f8fafc; padding: 12px; border-radius: 8px; margin: 10px 0; font-size: 14px; }
  .crypto-info strong { color: #1a2a3a; }
  .balance-display { background: linear-gradient(135deg, #10b981, #059669); color: white; padding: 20px; border-radius: 12px; text-align: center; margin: 15px 0; }
  .balance-display .amount { font-size: 32px; font-weight: bold; }
  .tab-container { display: flex; gap: 10px; margin-bottom: 15px; }
  .tab { flex: 1; padding: 12px; background: #e5e7eb; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .tab.active { background: #4a9eff; color: white; }
</style>
</head>
<body>
  <div class="container">
    <!-- Ana Sayfa -->
    <div id="page-home" class="card">
      <h1>⚡ Hash Power Mining</h1>
      <div>
        <div class="stat">💰 Kazanç: $<span id="totalEarned">0.00</span></div>
        <div class="stat"> Ürün: <span id="productCount">0</span></div>
        <div class="stat">💵 Yatırım: $<span id="totalInvested">0</span></div>
      </div>
      <br>
      <button class="btn" onclick="showPage('buy')"> Satın Al</button>
      <button class="btn" onclick="showPage('production')"> Üretim</button>
      <button class="btn btn-withdraw" onclick="showPage('withdraw')">💸 Çekim</button>
      <button class="btn" onclick="showPage('admin')"> Admin</button>
    </div>

    <!-- Satın Al -->
    <div id="page-buy" class="card hidden">
      <h2>💎 Satın Al</h2>
      <input type="number" id="buyAmount" placeholder="Miktar ($)" min="1" value="10">
      <button class="btn" onclick="buyProduct()">Satın Al</button>
      <button class="btn" style="background:#666" onclick="showPage('home')">Geri</button>
    </div>

    <!-- Üretim -->
    <div id="page-production" class="card hidden">
      <h2> Üretim Hattı</h2>
      <div id="products"></div>
      <button class="btn" style="background:#666" onclick="showPage('home')">Geri</button>
    </div>

    <!-- Çekim -->
    <div id="page-withdraw" class="card hidden">
      <h2> Çekim Talebi</h2>
      <div class="balance-display">
        <div>Mevcut Bakiye</div>
        <div class="amount">$<span id="withdrawBalance">0.00</span></div>
        <div style="font-size: 14px; margin-top: 5px;">Minimum çekim: $0.01</div>
      </div>
      
      <h3 style="margin: 15px 0 10px 0;"> Çekilecek Miktar (USD)</h3>
      <input type="number" id="withdrawAmount" placeholder="0.00" min="0.01" step="0.01" oninput="updateCryptoAmount()">
      
      <h3 style="margin: 15px 0 10px 0;">🪙 Kripto Seçimi</h3>
      <select id="withdrawCrypto" onchange="updateCryptoAmount()">
        <option value="trx">TRX (TRON) - ~$0.12</option>
        <option value="bnb">BNB (Binance Coin) - ~$600</option>
        <option value="xrp">XRP (Ripple) - ~$0.50</option>
      </select>
      
      <div class="crypto-info">
        <strong>Karşılık:</strong> <span id="cryptoEquivalent">0.00</span> <span id="cryptoSymbol">TRX</span>
      </div>
      
      <h3 style="margin: 15px 0 10px 0;">📍 Cüzdan Adresi</h3>
      <input type="text" id="walletAddress" placeholder="Cüzdan adresinizi girin...">
      
      <button class="btn btn-withdraw" onclick="requestWithdrawal()">💸 Çekim Talebi Oluştur</button>
      <button class="btn" style="background:#666" onclick="showPage('home')">Geri</button>
    </div>

    <!-- Admin -->
    <div id="page-admin" class="card hidden">
      <h2>🔐 Admin Panel</h2>
      <div class="tab-container">
        <button class="tab active" onclick="switchAdminTab('payments', this)">💳 Ödemeler</button>
        <button class="tab" onclick="switchAdminTab('withdrawals', this)">💸 Çekimler</button>
      </div>
      <div id="adminContent">Yükleniyor...</div>
      <button class="btn" style="background:#666" onclick="showPage('home')">Geri</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBIKI-XSa6OpMQxURyTbNOTRecUTFfuQVQ",
      authDomain: "hash-power-mining.firebaseapp.com",
      projectId: "hash-power-mining",
      storageBucket: "hash-power-mining.firebasestorage.app",
      messagingSenderId: "266480566753",
      appId: "1:266480566753:web:835b6e5119e4d3e4eb92a0"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    const ADMIN_ID = "8974010159";
    
    let currentUser = null;
    let userId = null;
    let products = [];
    let earnings = 0;
    let currentAdminTab = 'payments';
    let unsubscribe = null;
    
    const DAILY_RATE = 1 / 90;
    const PER_SECOND = DAILY_RATE / 86400;
    
    const CRYPTO_PRICES = { trx: 0.12, bnb: 600, xrp: 0.50 };
    const CRYPTO_SYMBOLS = { trx: 'TRX', bnb: 'BNB', xrp: 'XRP' };
    
    const tg = window.Telegram.WebApp;
    tg.ready();
    
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      currentUser = tg.initDataUnsafe.user;
    }
    
    auth.signInAnonymously().then(() => {
      userId = auth.currentUser.uid;
      console.log('✅ Giriş yapıldı:', userId);
      listenToData();
      setInterval(updateEarnings, 1000);
    }).catch(err => {
      console.error('Giriş hatası:', err);
    });
    
    // 🔧 GERÇEK ZAMANLI DİNLEME - Firestore'dan anlık güncelleme
    function listenToData() {
      if (unsubscribe) unsubscribe();
      
      unsubscribe = db.collection('users').doc(userId).onSnapshot((doc) => {
        if (doc.exists) {
          const data = doc.data();
          products = data.approvedPayments || [];
          earnings = data.totalEarned || 0;
          updateUI();
          console.log('📡 Güncel veri:', products.length, 'ürün, $' + earnings.toFixed(2));
        }
      }, (error) => {
        console.error('Dinleme hatası:', error);
      });
    }
    
    async function buyProduct() {
      const amount = parseFloat(document.getElementById('buyAmount').value);
      if (amount < 1) { alert('Minimum $1'); return; }
      
      const payment = {
        id: 'pay_' + Date.now(),
        amount: amount,
        earned: 0,
        status: 'pending',
        userId: userId,
        userName: currentUser ? currentUser.first_name : 'User',
        timestamp: Date.now()
      };
      
      try {
        const userRef = db.collection('users').doc(userId);
        const doc = await userRef.get();
        const data = doc.data() || {};
        const currentPending = data.pendingPayments || [];
        
        await userRef.set({
          pendingPayments: [...currentPending, payment],
          totalInvested: (data.totalInvested || 0) + amount
        }, { merge: true });
        
        alert('✅ Ödeme oluşturuldu! Admin onayı bekleniyor.');
        document.getElementById('buyAmount').value = '';
      } catch (error) {
        console.error('Satın alma hatası:', error);
        alert('❌ Hata: ' + error.message);
      }
    }
    
    function renderProducts() {
      const container = document.getElementById('products');
      container.innerHTML = '';
      
      if (products.length === 0) {
        container.innerHTML = '<p>Henüz ürün yok.</p>';
        return;
      }
      
      products.forEach(p => {
        const div = document.createElement('div');
        div.className = 'product';
        div.innerHTML = `
          <strong>$${p.amount}</strong><br>
          <small>Kazanç: $${(p.earned || 0).toFixed(6)}</small><br>
          <small>Saniye: $${(p.amount * PER_SECOND).toFixed(6)}</small>
        `;
        container.appendChild(div);
      });
    }
    
    // 🔧 SADECE approvedPayments'i güncelle, totalEarned'i ezme
    async function updateEarnings() {
      if (products.length === 0) return;
      
      products.forEach(p => {
        p.earned = (p.earned || 0) + (p.amount * PER_SECOND);
      });
      
      earnings = products.reduce((sum, p) => sum + p.earned, 0);
      
      try {
        await db.collection('users').doc(userId).set({
          approvedPayments: products
        }, { merge: true });
      } catch (error) {
        console.error('Kaydetme hatası:', error);
      }
      
      updateUI();
    }
    
    function updateUI() {
      document.getElementById('totalEarned').textContent = earnings.toFixed(2);
      document.getElementById('productCount').textContent = products.length;
      document.getElementById('totalInvested').textContent = products.reduce((sum, p) => sum + p.amount, 0);
      document.getElementById('withdrawBalance').textContent = earnings.toFixed(2);
      renderProducts();
    }
    
    function updateCryptoAmount() {
      const amount = parseFloat(document.getElementById('withdrawAmount').value) || 0;
      const crypto = document.getElementById('withdrawCrypto').value;
      const price = CRYPTO_PRICES[crypto];
      const equivalent = amount / price;
      
      document.getElementById('cryptoEquivalent').textContent = equivalent.toFixed(6);
      document.getElementById('cryptoSymbol').textContent = CRYPTO_SYMBOLS[crypto];
    }
    
    async function requestWithdrawal() {
      const amount = parseFloat(document.getElementById('withdrawAmount').value);
      const crypto = document.getElementById('withdrawCrypto').value;
      const walletAddress = document.getElementById('walletAddress').value.trim();
      
      if (amount < 0.01) { alert('❌ Minimum çekim: $0.01'); return; }
      if (amount > earnings) { alert('❌ Yetersiz bakiye!'); return; }
      if (!walletAddress) { alert('❌ Cüzdan adresi gerekli!'); return; }
      
      const withdrawal = {
        id: 'wd_' + Date.now(),
        amount: amount,
        crypto: crypto,
        cryptoAmount: (amount / CRYPTO_PRICES[crypto]).toFixed(6),
        cryptoSymbol: CRYPTO_SYMBOLS[crypto],
        walletAddress: walletAddress,
        status: 'pending',
        userId: userId,
        userName: currentUser ? currentUser.first_name : 'User',
        timestamp: Date.now()
      };
      
      try {
        const userRef = db.collection('users').doc(userId);
        const doc = await userRef.get();
        const data = doc.data() || {};
        const currentWithdrawals = data.withdrawalRequests || [];
        
        await userRef.set({
          withdrawalRequests: [...currentWithdrawals, withdrawal]
        }, { merge: true });
        
        alert('✅ Çekim talebi oluşturuldu! Admin onayı bekleniyor.');
        document.getElementById('withdrawAmount').value = '';
        document.getElementById('walletAddress').value = '';
        updateCryptoAmount();
      } catch (error) {
        console.error('Çekim hatası:', error);
        alert('❌ Hata: ' + error.message);
      }
    }
    
    async function loadAdminPayments() {
      try {
        const snapshot = await db.collection('users').get();
        const pending = [];
        
        snapshot.forEach(doc => {
          const data = doc.data();
          if (data.pendingPayments && data.pendingPayments.length > 0) {
            data.pendingPayments.forEach(p => {
              pending.push({ ...p, userDocId: doc.id });
            });
          }
        });
        
        if (pending.length === 0) return '<p>✅ Bekleyen ödeme yok</p>';
        
        let html = '';
        pending.forEach(p => {
          html += `
            <div class="pending-item">
              <strong>$${p.amount}</strong> - ${p.userName}<br>
              <small>ID: ${p.id}</small><br>
              <button class="btn btn-approve" onclick="approvePayment('${p.userDocId}', '${p.id}')">✓ Onayla</button>
              <button class="btn btn-reject" onclick="rejectPayment('${p.userDocId}', '${p.id}')">✕ Reddet</button>
            </div>
          `;
        });
        return html;
      } catch (error) {
        return ' Hata: ' + error.message;
      }
    }
    
    async function loadAdminWithdrawals() {
      try {
        const snapshot = await db.collection('users').get();
        const pending = [];
        
        snapshot.forEach(doc => {
          const data = doc.data();
          if (data.withdrawalRequests && data.withdrawalRequests.length > 0) {
            data.withdrawalRequests.forEach(w => {
              if (w.status === 'pending') {
                pending.push({ ...w, userDocId: doc.id });
              }
            });
          }
        });
        
        if (pending.length === 0) return '<p>✅ Bekleyen çekim yok</p>';
        
        let html = '';
        pending.forEach(w => {
          html += `
            <div class="withdrawal-item">
              <strong>$${w.amount}</strong> = ${w.cryptoAmount} ${w.cryptoSymbol}<br>
              <small>Kullanıcı: ${w.userName}</small><br>
              <small>Cüzdan: ${w.walletAddress}</small><br>
              <small>ID: ${w.id}</small><br>
              <button class="btn btn-approve" onclick="approveWithdrawal('${w.userDocId}', '${w.id}')">✓ Onayla</button>
              <button class="btn btn-reject" onclick="rejectWithdrawal('${w.userDocId}', '${w.id}')">✕ Reddet</button>
            </div>
          `;
        });
        return html;
      } catch (error) {
        return '❌ Hata: ' + error.message;
      }
    }
    
    async function loadAdmin() {
      if (currentUser?.id?.toString() !== ADMIN_ID) {
        alert('Yetkiniz yok!');
        showPage('home');
        return;
      }
      
      const container = document.getElementById('adminContent');
      container.innerHTML = 'Yükleniyor...';
      
      if (currentAdminTab === 'payments') {
        container.innerHTML = await loadAdminPayments();
      } else {
        container.innerHTML = await loadAdminWithdrawals();
      }
    }
    
    function switchAdminTab(tab, btn) {
      currentAdminTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      loadAdmin();
    }
    
    async function approvePayment(targetUserDocId, paymentId) {
      try {
        const userRef = db.collection('users').doc(targetUserDocId);
        const doc = await userRef.get();
        
        if (!doc.exists) { alert('Kullanıcı bulunamadı!'); return; }
        
        const data = doc.data();
        const pendingPayments = data.pendingPayments || [];
        const approvedPayments = data.approvedPayments || [];
        
        const paymentIndex = pendingPayments.findIndex(p => p.id === paymentId);
        if (paymentIndex === -1) { alert('Ödeme bulunamadı!'); return; }
        
        const payment = pendingPayments[paymentIndex];
        const newPending = pendingPayments.filter(p => p.id !== paymentId);
        
        payment.status = 'approved';
        payment.approvedAt = Date.now();
        
        await userRef.set({
          pendingPayments: newPending,
          approvedPayments: [...approvedPayments, payment],
          totalInvested: (data.totalInvested || 0) + payment.amount
        }, { merge: true });
        
        alert('✅ Ödeme onaylandı!');
        await loadAdmin();
      } catch (error) {
        alert('❌ Hata: ' + error.message);
      }
    }
    
    async function rejectPayment(targetUserDocId, paymentId) {
      try {
        const userRef = db.collection('users').doc(targetUserDocId);
        const doc = await userRef.get();
        
        if (!doc.exists) { alert('Kullanıcı bulunamadı!'); return; }
        
        const data = doc.data();
        const pendingPayments = data.pendingPayments || [];
        const newPending = pendingPayments.filter(p => p.id !== paymentId);
        
        await userRef.set({
          pendingPayments: newPending
        }, { merge: true });
        
        alert('❌ Ödeme reddedildi!');
        await loadAdmin();
      } catch (error) {
        alert('❌ Hata: ' + error.message);
      }
    }
    
    // 🔧 ÇEKİM ONAYLAMA - BAKİYEDEN DÜŞÜR
    async function approveWithdrawal(targetUserDocId, withdrawalId) {
      try {
        const userRef = db.collection('users').doc(targetUserDocId);
        const doc = await userRef.get();
        
        if (!doc.exists) { alert('Kullanıcı bulunamadı!'); return; }
        
        const data = doc.data();
        const withdrawalRequests = data.withdrawalRequests || [];
        
        const withdrawalIndex = withdrawalRequests.findIndex(w => w.id === withdrawalId);
        if (withdrawalIndex === -1) { alert('Çekim talebi bulunamadı!'); return; }
        
        const withdrawal = withdrawalRequests[withdrawalIndex];
        const newWithdrawals = withdrawalRequests.filter(w => w.id !== withdrawalId);
        
        withdrawal.status = 'approved';
        withdrawal.approvedAt = Date.now();
        newWithdrawals.push(withdrawal);
        
        // 🔧 BAKİYEDEN DÜŞÜR
        const currentEarnings = data.totalEarned || 0;
        const newEarnings = Math.max(0, currentEarnings - withdrawal.amount);
        
        await userRef.set({
          withdrawalRequests: newWithdrawals,
          totalEarned: newEarnings
        }, { merge: true });
        
        console.log('✅ Çekim onaylandı:', withdrawalId, 'Yeni bakiye:', newEarnings);
        alert('✅ Çekim onaylandı! $' + withdrawal.amount + ' bakiyeden düşüldü.');
        await loadAdmin();
      } catch (error) {
        alert('❌ Hata: ' + error.message);
      }
    }
    
    async function rejectWithdrawal(targetUserDocId, withdrawalId) {
      try {
        const userRef = db.collection('users').doc(targetUserDocId);
        const doc = await userRef.get();
        
        if (!doc.exists) { alert('Kullanıcı bulunamadı!'); return; }
        
        const data = doc.data();
        const withdrawalRequests = data.withdrawalRequests || [];
        const newWithdrawals = withdrawalRequests.filter(w => w.id !== withdrawalId);
        
        await userRef.set({
          withdrawalRequests: newWithdrawals
        }, { merge: true });
        
        alert('❌ Çekim reddedildi!');
        await loadAdmin();
      } catch (error) {
        alert('❌ Hata: ' + error.message);
      }
    }
    
    function showPage(page) {
      document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
      document.getElementById('page-' + page).classList.remove('hidden');
      
      if (page === 'production') {
        renderProducts();
      } else if (page === 'withdraw') {
        updateCryptoAmount();
      } else if (page === 'admin') {
        loadAdmin();
      }
    }
  </script>
</body>
</html>
