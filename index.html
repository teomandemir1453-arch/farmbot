<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>Micro Monetize</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

html,body{
    min-height:100%;
}

body{
    background:
        radial-gradient(
            circle at 50% -10%,
            #2b1460 0%,
            #11183b 35%,
            #05091b 100%
        );
    color:#fff;
    min-height:100vh;
    padding:14px;
}

.app{
    max-width:520px;
    margin:auto;
    padding-bottom:30px;
}

/* HEADER */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-icon{
    width:42px;
    height:42px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        linear-gradient(
            135deg,
            #9b4dff,
            #5520bd
        );
    font-size:21px;
}

.logo-title{
    font-size:16px;
    font-weight:900;
}

.logo-sub{
    font-size:10px;
    color:#8995bd;
    margin-top:2px;
}

.telegram-user{
    text-align:right;
}

.telegram-name{
    font-size:11px;
    font-weight:800;
}

.telegram-id{
    color:#7e8bae;
    font-size:9px;
}

/* STATUS */

.status{
    display:flex;
    align-items:center;
    gap:8px;
    background:#0d1530;
    border:1px solid rgba(120,140,200,.2);
    border-radius:10px;
    padding:9px 11px;
    margin-bottom:14px;
    font-size:10px;
    color:#aab5d7;
}

.status-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#ff5364;
}

.status-dot.ok{
    background:#34e98a;
}

/* BALANCE */

.balance-card{
    position:relative;
    overflow:hidden;
    border-radius:20px;
    padding:20px;
    margin-bottom:14px;
    background:
        linear-gradient(
            135deg,
            #7b3bdd,
            #4a1ba1
        );
    box-shadow:
        0 18px 45px rgba(85,35,170,.28);
}

.balance-card::after{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    border-radius:50%;
    right:-80px;
    top:-85px;
    background:rgba(255,255,255,.08);
}

.balance-label{
    font-size:11px;
    color:#dfd4ff;
    margin-bottom:7px;
}

.balance-value{
    font-size:36px;
    font-weight:950;
    letter-spacing:-1px;
}

.balance-user{
    margin-top:10px;
    font-size:10px;
    color:#d9c9ff;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-bottom:14px;
}

.stat{
    background:#0d1530;
    border:1px solid rgba(120,140,200,.2);
    border-radius:14px;
    padding:14px;
}

.stat-title{
    font-size:9px;
    color:#7f8caf;
    margin-bottom:6px;
}

.stat-value{
    font-size:18px;
    font-weight:900;
}

.green{
    color:#45e997;
}

.gold{
    color:#ffd454;
}

.red{
    color:#ff6c79;
}

/* SECTION */

.section{
    background:#0d1530;
    border:1px solid rgba(120,140,200,.2);
    border-radius:16px;
    padding:15px;
    margin-bottom:14px;
}

.section-title{
    font-size:13px;
    font-weight:900;
    margin-bottom:12px;
}

.info-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid rgba(120,140,200,.12);
    font-size:11px;
}

.info-row:last-child{
    border-bottom:none;
}

.info-label{
    color:#8e99bb;
}

.info-value{
    text-align:right;
    font-weight:800;
}

/* ACTIONS */

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.button{
    border:0;
    border-radius:11px;
    padding:12px;
    color:#fff;
    font-weight:900;
    cursor:pointer;
}

.button-main{
    background:
        linear-gradient(
            135deg,
            #9b4dff,
            #6125ce
        );
}

.button-secondary{
    background:#121a38;
    border:1px solid rgba(140,160,215,.25);
}

/* LOADING */

.loading{
    text-align:center;
    padding:30px 15px;
    color:#8290b4;
    font-size:11px;
}

/* ERROR */

.error{
    padding:12px;
    border-radius:10px;
    background:rgba(255,70,85,.1);
    border:1px solid rgba(255,70,85,.25);
    color:#ff8992;
    font-size:10px;
    line-height:1.5;
    margin-bottom:12px;
}

/* FOOTER */

.footer{
    text-align:center;
    margin-top:12px;
    color:#687594;
    font-size:9px;
}

/* MOBILE */

@media(max-width:380px){

    body{
        padding:10px;
    }

    .balance-value{
        font-size:31px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">

            <div class="logo-icon">
                ⚡
            </div>

            <div>

                <div class="logo-title">
                    Micro Monetize
                </div>

                <div class="logo-sub">
                    Telegram Mini App
                </div>

            </div>

        </div>

        <div class="telegram-user">

            <div
                class="telegram-name"
                id="telegramName">
                Kullanıcı
            </div>

            <div
                class="telegram-id"
                id="telegramId">
                -
            </div>

        </div>

    </div>


    <!-- STATUS -->

    <div class="status">

        <span
            class="status-dot"
            id="statusDot">
        </span>

        <span id="statusText">
            Bağlanıyor...
        </span>

    </div>


    <div id="errorBox"></div>


    <!-- BALANCE -->

    <div class="balance-card">

        <div class="balance-label">
            TOPLAM BAKİYE
        </div>

        <div
            class="balance-value"
            id="balance">
            $0.00
        </div>

        <div
            class="balance-user"
            id="balanceUser">
            Hesap yükleniyor...
        </div>

    </div>


    <!-- STATS -->

    <div class="stats">

        <div class="stat">

            <div class="stat-title">
                TOPLAM YATIRIM
            </div>

            <div
                class="stat-value gold"
                id="totalInvested">
                $0.00
            </div>

        </div>

        <div class="stat">

            <div class="stat-title">
                TOPLAM ÇEKİM
            </div>

            <div
                class="stat-value red"
                id="totalWithdrawn">
                $0.00
            </div>

        </div>

        <div class="stat">

            <div class="stat-title">
                REFERANS KAZANCI
            </div>

            <div
                class="stat-value green"
                id="referralEarnings">
                $0.00
            </div>

        </div>

        <div class="stat">

            <div class="stat-title">
                TELEGRAM ID
            </div>

            <div
                class="stat-value"
                id="accountId"
                style="font-size:13px">
                -
            </div>

        </div>

    </div>


    <!-- ACCOUNT -->

    <div class="section">

        <div class="section-title">
            👤 Hesap Bilgileri
        </div>

        <div class="info-row">

            <span class="info-label">
                Kullanıcı adı
            </span>

            <span
                class="info-value"
                id="username">
                -
            </span>

        </div>

        <div class="info-row">

            <span class="info-label">
                Ad
            </span>

            <span
                class="info-value"
                id="firstName">
                -
            </span>

        </div>

        <div class="info-row">

            <span class="info-label">
                Dil
            </span>

            <span
                class="info-value"
                id="language">
                -
            </span>

        </div>

        <div class="info-row">

            <span class="info-label">
                Kayıt tarihi
            </span>

            <span
                class="info-value"
                id="createdAt">
                -
            </span>

        </div>

    </div>


    <!-- ACTIONS -->

    <div class="section">

        <div class="section-title">
            ⚡ Hesap İşlemleri
        </div>

        <div class="actions">

            <button
                class="button button-main"
                onclick="refreshAccount()">
                🔄 Yenile
            </button>

            <button
                class="button button-secondary"
                onclick="closeMiniApp()">
                ✕ Kapat
            </button>

        </div>

    </div>


    <div class="footer">
        Micro Monetize • PostgreSQL Account System
    </div>

</div>


<script>

/*
========================================================
TELEGRAM
========================================================
*/

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;

if(tg){

    tg.ready();
    tg.expand();

}


/*
========================================================
API
========================================================
*/

const API_BASE =
    'https://cargo-tba-herbs-sheffield.trycloudflare.com';


let telegramUser = null;
let account = null;


/*
========================================================
HELPERS
========================================================
*/

function money(value){

    return '$' +
        Number(value || 0)
        .toFixed(2);
}


function formatDate(value){

    if(!value){
        return '-';
    }

    const d = new Date(value);

    if(Number.isNaN(
        d.getTime()
    )){
        return '-';
    }

    return d.toLocaleString(
        'tr-TR'
    );
}


function setStatus(ok,text){

    document
        .getElementById('statusDot')
        .classList.toggle(
            'ok',
            ok
        );

    document
        .getElementById('statusText')
        .textContent =
        text;
}


function showError(message){

    document
        .getElementById('errorBox')
        .innerHTML = `
            <div class="error">
                ❌ ${escapeHtml(message)}
            </div>
        `;
}


function clearError(){

    document
        .getElementById('errorBox')
        .innerHTML = '';
}


function escapeHtml(value){

    return String(value ?? '')
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
}


/*
========================================================
TELEGRAM KULLANICISI
========================================================
*/

function getTelegramUser(){

    if(!tg){

        return null;
    }

    /*
     * Bu sadece arayüz bilgisidir.
     * Hesap doğrulaması backend tarafından
     * tg.initData üzerinden yapılır.
     */

    return tg.initDataUnsafe &&
           tg.initDataUnsafe.user
        ? tg.initDataUnsafe.user
        : null;
}


/*
========================================================
KULLANICI KAYDI
========================================================
*/

async function registerUser(){

    if(!tg){

        throw new Error(
            'Telegram Mini App bulunamadı.'
        );
    }

    if(!tg.initData){

        throw new Error(
            'Telegram initData bulunamadı. Uygulamayı Telegram içerisinden aç.'
        );
    }

    const response =
        await fetch(
            API_BASE + '/api/user',
            {
                method:'POST',

                headers:{
                    'Content-Type':
                        'application/json'
                },

                body:JSON.stringify({
                    initData:
                        tg.initData
                })
            }
        );

    const data =
        await response.json();

    if(
        !response.ok ||
        !data.ok
    ){

        throw new Error(
            data.message ||
            'Kullanıcı kaydı başarısız.'
        );
    }

    return data.user;
}


/*
========================================================
ACCOUNT
========================================================
*/

async function loadAccount(
    telegramId
){

    const response =
        await fetch(
            API_BASE +
            '/api/account/' +
            encodeURIComponent(
                telegramId
            )
        );

    const data =
        await response.json();

    if(
        !response.ok ||
        !data.ok
    ){

        throw new Error(
            data.message ||
            'Hesap yüklenemedi.'
        );
    }

    return data.account;
}


/*
========================================================
UI
========================================================
*/

function renderUser(user){

    if(!user){
        return;
    }

    document.getElementById(
        'telegramName'
    ).textContent =
        user.first_name ||
        'Kullanıcı';

    document.getElementById(
        'telegramId'
    ).textContent =
        'TG ' +
        user.id;

    document.getElementById(
        'telegramName'
    ).title =
        user.username
            ? '@' + user.username
            : '';
}


function renderAccount(data){

    account = data;

    document.getElementById(
        'balance'
    ).textContent =
        money(data.balance);

    document.getElementById(
        'balanceUser'
    ).textContent =
        data.username
            ? '@' + data.username
            : data.first_name || 'Hesabınız';

    document.getElementById(
        'totalInvested'
    ).textContent =
        money(data.total_invested);

    document.getElementById(
        'totalWithdrawn'
    ).textContent =
        money(data.total_withdrawn);

    document.getElementById(
        'referralEarnings'
    ).textContent =
        money(data.referral_earnings);

    document.getElementById(
        'accountId'
    ).textContent =
        data.telegram_id;

    document.getElementById(
        'username'
    ).textContent =
        data.username
            ? '@' + data.username
            : '-';

    document.getElementById(
        'firstName'
    ).textContent =
        data.first_name || '-';

    document.getElementById(
        'language'
    ).textContent =
        data.language || '-';

    document.getElementById(
        'createdAt'
    ).textContent =
        formatDate(data.created_at);
}


/*
========================================================
BAŞLAT
========================================================
*/

async function startApp(){

    try{

        clearError();

        setStatus(
            false,
            'Telegram hesabı doğrulanıyor...'
        );

        telegramUser =
            getTelegramUser();

        renderUser(
            telegramUser
        );

        const savedUser =
            await registerUser();

        /*
         * Telegram'dan gelen doğrulanmış
         * kullanıcıyı kullanıyoruz.
         */

        const telegramId =
            savedUser.telegram_id;

        const loadedAccount =
            await loadAccount(
                telegramId
            );

        renderAccount(
            loadedAccount
        );

        setStatus(
            true,
            '✅ Hesap ve PostgreSQL bağlantısı aktif'
        );

    }catch(error){

        console.error(
            error
        );

        setStatus(
            false,
            '❌ Bağlantı hatası'
        );

        showError(
            error.message
        );
    }
}


/*
========================================================
YENİLE
========================================================
*/

async function refreshAccount(){

    if(!account){
        await startApp();
        return;
    }

    try{

        clearError();

        setStatus(
            true,
            '🔄 Bakiye güncelleniyor...'
        );

        const updated =
            await loadAccount(
                account.telegram_id
            );

        renderAccount(
            updated
        );

        setStatus(
            true,
            '✅ Bakiye güncel'
        );

    }catch(error){

        showError(
            error.message
        );

        setStatus(
            false,
            '❌ Güncelleme başarısız'
        );
    }
}


/*
========================================================
KAPAT
========================================================
*/

function closeMiniApp(){

    if(tg){

        tg.close();

    }
}


/*
========================================================
START
========================================================
*/

startApp();

</script>

</body>
</html>
