<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Games</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    background:
    radial-gradient(circle at top,#20104d,#070b22 60%);
    color:white;
    padding:15px;
}


.container{
    max-width:600px;
    margin:auto;
}


.header{
    text-align:center;
    padding:25px 10px;
}


.header h1{
    font-size:32px;
    font-weight:900;
}


.header p{
    margin-top:8px;
    color:#9da8ca;
    font-size:14px;
}



.game-card{

    margin-top:20px;
    background:
    linear-gradient(145deg,#111a38,#0c1330);

    border:1px solid rgba(155,77,255,.4);
    border-radius:18px;

    padding:15px;

    display:flex;
    align-items:center;
    gap:15px;

}


.game-icon{

    width:60px;
    height:60px;

    border-radius:16px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:32px;

    background:rgba(155,77,255,.2);

}



.game-info{
    flex:1;
}


.game-info h2{

    font-size:18px;

}


.game-info p{

    margin-top:5px;
    color:#9da8ca;
    font-size:12px;

}



.play-btn{

    background:#9b4dff;
    color:white;

    border:none;

    padding:10px 14px;

    border-radius:10px;

    font-weight:800;

}



</style>

</head>


<body>


<div class="container">


<div class="header">

<h1>🎮 GAMES</h1>

<p>Play mini games</p>

</div>



<div class="game-card">


<div class="game-icon">
💣
</div>


<div class="game-info">

<h2>Minesweeper</h2>

<p>Classic mine finding game</p>

</div>


<div class="game-card" onclick="window.location.href='/games/minesweeper/index.html'">

    <h3>💣 MINESWEEPER</h3>

    <p>PLAY NOW</p>

</div>


</div>


</div>



<script>

const tg = window.Telegram.WebApp;

if(tg){
    tg.expand();
}


</script>


</body>
</html>
